<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乌东文旅 - 快速登录测试工具</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .status {
      background: #f7f8fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .status-item:last-child {
      border-bottom: none;
    }

    .status-label {
      font-weight: 600;
      color: #333;
    }

    .status-value {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge.success {
      background: #67c23a;
      color: white;
    }

    .badge.error {
      background: #f56c6c;
      color: white;
    }

    .badge.warning {
      background: #e6a23c;
      color: white;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-success {
      background: #67c23a;
      color: white;
    }

    .btn-info {
      background: #409eff;
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 8px;
      padding: 15px;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 20px;
    }

    .log-item {
      margin-bottom: 5px;
    }

    .log-success {
      color: #4ec9b0;
    }

    .log-error {
      color: #f48771;
    }

    .log-info {
      color: #4fc1ff;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin: 30px 0;
    }

    .accounts {
      background: #f7f8fa;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
    }

    .accounts h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #666;
    }

    .account-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 乌东文旅 - 测试工具</h1>
    <p class="subtitle">快速登录和系统检测</p>

    <!-- 系统状态 -->
    <div class="status">
      <div class="status-item">
        <span class="status-label">前端服务</span>
        <div class="status-value">
          <span id="frontend-url">http://localhost:3001</span>
          <span id="frontend-status" class="badge warning">检测中</span>
        </div>
      </div>
      <div class="status-item">
        <span class="status-label">后端服务</span>
        <div class="status-value">
          <span id="backend-url">http://localhost:8001</span>
          <span id="backend-status" class="badge warning">检测中</span>
        </div>
      </div>
      <div class="status-item">
        <span class="status-label">登录状态</span>
        <div class="status-value">
          <span id="login-status" class="badge error">未登录</span>
        </div>
      </div>
    </div>

    <!-- 登录表单 -->
    <div class="form-group">
      <label>手机号</label>
      <input type="text" id="phone" value="13800138000" placeholder="请输入手机号">
    </div>

    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" value="123456" placeholder="请输入密码">
    </div>

    <button class="btn btn-primary" id="loginBtn">立即登录</button>
    <button class="btn btn-success" id="checkBtn">检测系统状态</button>
    <button class="btn btn-info" id="gotoBtn" disabled>前往社区首页</button>

    <!-- 测试账号 -->
    <div class="accounts">
      <h3>📝 测试账号</h3>
      <div class="account-item">
        <span>主账号: 13800138000</span>
        <span>密码: 123456</span>
      </div>
      <div class="account-item">
        <span>测试账号2: 13800138001</span>
        <span>密码: 123456</span>
      </div>
    </div>

    <!-- 日志 -->
    <div class="log" id="log"></div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8001'
    const FRONTEND_BASE = 'http://localhost:3001'

    // 日志函数
    function log(message, type = 'info') {
      const logDiv = document.getElementById('log')
      const time = new Date().toLocaleTimeString()
      const className = type === 'error' ? 'log-error' : type === 'success' ? 'log-success' : 'log-info'
      logDiv.innerHTML += `<div class="log-item ${className}">[${time}] ${message}</div>`
      logDiv.scrollTop = logDiv.scrollHeight
    }

    // 检查系统状态
    async function checkStatus() {
      log('开始检测系统状态...', 'info')

      // 检查后端
      try {
        const response = await fetch(`${API_BASE}/`, { method: 'GET' })
        document.getElementById('backend-status').className = 'badge success'
        document.getElementById('backend-status').textContent = '运行中'
        log('✅ 后端服务正常', 'success')
      } catch (error) {
        document.getElementById('backend-status').className = 'badge error'
        document.getElementById('backend-status').textContent = '异常'
        log('❌ 后端服务无法连接', 'error')
      }

      // 检查前端（通过当前页面判断）
      document.getElementById('frontend-status').className = 'badge success'
      document.getElementById('frontend-status').textContent = '运行中'
      log('✅ 前端服务正常（当前页面可访问）', 'success')

      // 检查登录状态
      const token = localStorage.getItem('token')
      if (token) {
        document.getElementById('login-status').className = 'badge success'
        document.getElementById('login-status').textContent = '已登录'
        document.getElementById('gotoBtn').disabled = false
        log('✅ 已登录状态', 'success')
      } else {
        document.getElementById('login-status').className = 'badge error'
        document.getElementById('login-status').textContent = '未登录'
        log('⚠️  未登录，请先登录', 'info')
      }
    }

    // 登录
    async function login() {
      const phone = document.getElementById('phone').value
      const password = document.getElementById('password').value
      const loginBtn = document.getElementById('loginBtn')

      if (!phone || !password) {
        log('❌ 请输入手机号和密码', 'error')
        return
      }

      loginBtn.disabled = true
      loginBtn.textContent = '登录中...'
      log(`正在登录: ${phone}`, 'info')

      try {
        const response = await fetch(`${API_BASE}/app/user/login/password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone, password })
        })

        const data = await response.json()

        if (data.code === 0) {
          localStorage.setItem('token', data.data.token)
          log('✅ 登录成功！', 'success')
          log(`Token: ${data.data.token.substring(0, 50)}...`, 'info')

          document.getElementById('login-status').className = 'badge success'
          document.getElementById('login-status').textContent = '已登录'
          document.getElementById('gotoBtn').disabled = false

          setTimeout(() => {
            log('3秒后自动跳转到社区首页...', 'info')
            setTimeout(() => {
              window.location.href = `${FRONTEND_BASE}/community`
            }, 3000)
          }, 500)
        } else {
          log(`❌ 登录失败: ${data.message}`, 'error')
        }
      } catch (error) {
        log(`❌ 登录请求失败: ${error.message}`, 'error')
      } finally {
        loginBtn.disabled = false
        loginBtn.textContent = '立即登录'
      }
    }

    // 前往社区
    function gotoSite() {
      window.location.href = `${FRONTEND_BASE}/community`
    }

    // 事件绑定
    document.getElementById('loginBtn').addEventListener('click', login)
    document.getElementById('checkBtn').addEventListener('click', checkStatus)
    document.getElementById('gotoBtn').addEventListener('click', gotoSite)

    // 回车登录
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') login()
    })

    // 初始化检查
    window.onload = () => {
      log('🚀 系统初始化...', 'info')
      checkStatus()
    }
  </script>
</body>
</html>
