<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <pattern id="miao" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- 简化苗族蝴蝶纹/几何纹 -->
      <path d="M30 10 L30 50 M10 30 L50 30" stroke="#fff" stroke-width="0.8" opacity="0.25" fill="none" />
      <circle cx="30" cy="30" r="6" stroke="#fff" stroke-width="0.8" fill="none" opacity="0.4" />
      <circle cx="30" cy="30" r="2" fill="#fff" opacity="0.4" />
      <path d="M22 22 L30 30 L38 22 M22 38 L30 30 L38 38" stroke="#fff" stroke-width="0.6" fill="none" opacity="0.3" />
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3a5f" />
      <stop offset="50%" stop-color="#2d4a7c" />
      <stop offset="100%" stop-color="#0e8c7e" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" />
  <rect width="400" height="300" fill="url(#miao)" />

  <!-- 远山轮廓 -->
  <path d="M0 220 Q 80 180, 160 210 T 320 200 T 400 220 L 400 300 L 0 300 Z" fill="rgba(255,255,255,0.08)" />
  <path d="M0 240 Q 100 220, 200 240 T 400 240 L 400 300 L 0 300 Z" fill="rgba(255,255,255,0.05)" />

  <!-- 中央银饰纹样 -->
  <g transform="translate(200, 150)" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.85">
    <circle cx="0" cy="0" r="60" />
    <circle cx="0" cy="0" r="42" />
    <circle cx="0" cy="0" r="10" fill="#fff" opacity="0.5" />
    <g stroke-linecap="round">
      <path d="M0 -60 C -10 0, -10 0, 0 60" />
      <path d="M0 -60 C 10 0, 10 0, 0 60" />
      <path d="M-60 0 C 0 -10, 0 -10, 60 0" />
      <path d="M-60 0 C 0 10, 0 10, 60 0" />
      <path d="M-42 -42 C -10 -10, -10 -10, 0 0" />
      <path d="M42 -42 C 10 -10, 10 -10, 0 0" />
      <path d="M-42 42 C -10 10, -10 10, 0 0" />
      <path d="M42 42 C 10 10, 10 10, 0 0" />
    </g>
  </g>
</svg>