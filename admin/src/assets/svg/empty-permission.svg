<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <style>
    .line { stroke: #0e8c7e; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #c08a3e; stroke: none; }
    .soft { stroke: #c08a3e; stroke-width: 1.5; fill: none; opacity: 0.5; stroke-dasharray: 2 3; }
  </style>
  <!-- 锁 -->
  <rect class="line" x="90" y="80" width="60" height="50" rx="6" />
  <path class="line" d="M100 80 L100 60 A 20 20 0 0 1 140 60 L 140 80" />
  <circle class="accent" cx="120" cy="105" r="4" />
  <line class="line" x1="120" y1="109" x2="120" y2="118" />

  <!-- 装饰 -->
  <circle class="accent" cx="180" cy="50" r="3" />
  <circle class="accent" cx="60" cy="130" r="2.5" opacity="0.6" />
  <circle class="soft" cx="50" cy="60" r="4" />
  <circle class="soft" cx="190" cy="130" r="5" />

  <text x="120" y="160" fill="#7c8da6" font-size="10" text-anchor="middle" font-family="sans-serif">无访问权限</text>
</svg>